<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Verba">
  <!--
    A V that is also a tick, standing over a line of type.

    The two things this tool does are write documentation and check it against a
    running product. A V with a short left arm and a long right one is read as
    both letter and checkmark without being asked to be either, and the long arm
    carries far enough past the vertex to keep it from settling into the generic
    tick-in-a-circle every success message uses.

    The bar is set short and to the left rather than centred, because a centred
    bar under a tick is an underline and a ragged one is a line of text: the
    sentence being checked. It is the difference between the mark meaning "done"
    and meaning "read".

    An earlier attempt drew a camera aperture. Six symmetric blades around a
    centre is a wagon wheel at every size, and the detail in the middle turned
    to mush at sixteen pixels, which is the only size that has to work. This is
    two shapes and a hard edge, so the silhouette survives the shrink.
  -->
  <defs>
    <linearGradient id="v-disc" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#5C62FF"/>
      <stop offset="0.55" stop-color="#3A40E0"/>
      <stop offset="1" stop-color="#252AB8"/>
    </linearGradient>
    <clipPath id="v-round">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#v-disc)"/>

  <!-- Clipped to the disc as a guarantee. A round cap adds half the stroke
       width past the point it is drawn to, which put the long arm outside the
       circle and read as a defect at sixteen pixels. -->
  <g clip-path="url(#v-round)">
    <!-- one stroke, so it stays one shape when it shrinks -->
    <path d="M17 19 L28.5 40 L48 13.5"
          fill="none" stroke="#FFFFFF" stroke-width="8.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- the line it is reading, ragged right like real type -->
    <path d="M20.5 51 H39.5"
          fill="none" stroke="#FFFFFF" stroke-width="6.5"
          stroke-linecap="round" opacity="0.88"/>
  </g>
</svg>
