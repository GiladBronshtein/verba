<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verba</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/fonts.css">
</head>
<body>
<div id="sprite"></div>
<div class="app">
  <aside>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/>
          <path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>
        </svg>
      </div>
      <div class="who">
        <h1 id="appName">Verba</h1>
        <div class="sub" id="docTitle">loading</div>
      </div>
      <button class="fold" id="fold" title="Collapse the sidebar"
              aria-label="Collapse the sidebar"></button>
    </div>

    <div class="edition">
      <label class="field" style="gap:4px">
        <span class="visually-hidden" style="position:absolute;left:-9999px">Edition</span>
        <select id="profile" title="Edition"></select>
      </label>
    </div>

    <nav class="nav" id="nav" aria-label="Sections of the console"></nav>

    <div class="tree" id="tree" aria-label="Document outline"></div>
    <div class="rail-grip" id="railGrip" title="Drag to resize"
         role="separator" aria-orientation="vertical" tabindex="0"></div>
  </aside>

  <main id="main" tabindex="-1"></main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
