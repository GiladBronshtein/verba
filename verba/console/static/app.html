<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verba</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/fonts.css">
<script>
  /* Before the first paint, or the page flashes the wrong palette and then
     corrects itself, which reads as a bug every single time it loads. */
  (function () {
    var v = localStorage.getItem('verba.scheme');
    if (v === 'light' || v === 'dark') {
      document.documentElement.setAttribute('data-theme', v);
    }
  })();
</script>
</head>
<body>
<div id="sprite"></div>
<div class="app">
  <!-- The header carries who you are and where you are in the process. Both used
       to live in the left rail, which meant the rail was doing three jobs at
       once: identity, the sequence, and whatever the current view needed. With
       a section open the outline was pushed below the appearance toggle, small
       and unreachable, which is what a rail with three jobs does to the third. -->
  <header class="top">
    <a class="brand" href="#" id="home" title="Overview">
      <span class="mark" aria-hidden="true">
        <!-- the same mark as the tab icon: a V that is also a tick, over the
             line of type it is checking -->
        <svg width="22" height="22" viewBox="0 0 64 64">
          <path d="M17 19 L28.5 40 L48 13.5" fill="none" stroke="currentColor"
                stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20.5 51 H39.5" fill="none" stroke="currentColor"
                stroke-width="6.5" stroke-linecap="round" opacity="0.88"/>
        </svg>
      </span>
      <span class="wordmark">Verba</span>
    </a>

    <button class="doc" id="docTitle" title="Switch document, or start a new one">
      loading
    </button>

    <nav class="flow" id="steps" aria-label="The document, step by step"></nav>

    <div class="tools">
      <label class="field">
        <span class="visually-hidden" style="position:absolute;left:-9999px">Edition</span>
        <select id="profile" title="Edition"></select>
      </label>
      <div id="scheme"></div>
      <button class="icon-btn" id="reload" title="Read the content tree again from disk"
              aria-label="Reload from disk"></button>
    </div>
  </header>

  <aside>
    <!-- Contextual. The outline while you are writing, the places you look at
         and the things you set up otherwise. One job at a time. -->
    <nav class="nav" id="nav" aria-label="Elsewhere in the console"></nav>
    <div class="tree" id="tree" aria-label="Document outline"></div>
    <div class="rail-foot">
      <button class="foldbtn" id="fold" title="Hide the sidebar"
              aria-label="Hide the sidebar"></button>
    </div>
    <div class="rail-grip" id="railGrip" title="Drag to resize"
         role="separator" aria-orientation="vertical" tabindex="0"></div>
  </aside>

  <main id="main" tabindex="-1"></main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
