[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verba-docs"
version = "1.0.0"
description = "Technical documentation built from the running system, not from memory."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 form. The older `license = { text = "MIT" }` table is rejected outright
# by current setuptools once `license-files` is present, which made the package
# unbuildable from a clean checkout. Nobody knew, because nothing built it.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gilad Bronshtein" }]
keywords = ["documentation", "technical-writing", "playwright", "docx", "screenshots"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
]
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "python-docx>=1.1",
  "playwright>=1.44",
  "Pillow>=10.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]
# The writing assistance talks to a model over the Anthropic Messages API. It is
# optional because capture, drift, lint, build and release do not need it, and a
# documentation tool should not require a model to render a document. It was
# imported without ever being declared, so a clean install produced a console
# whose assistance was permanently unavailable and blamed the user's machine.
assist = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/GiladBronshtein/verba"
Issues = "https://github.com/GiladBronshtein/verba/issues"

[project.scripts]
verba = "verba.cli:main"

[tool.setuptools]
packages = ["verba", "verba.console", "verba.render"]

[tool.setuptools.package-data]
verba = ["console/static/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E702 is a semicolon joining two statements. Used here only for pairs that are
# one thought (`self.page, self.text = a, b`-shaped bookkeeping), and splitting
# them makes the surrounding logic harder to read rather than easier. Every
# other default rule is on, including the ones that caught a duplicate dict key
# silently discarding a section's own note, and seven values computed and thrown
# away.
ignore = ["E702"]
