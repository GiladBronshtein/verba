[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verba-docs"
version = "1.0.0"
description = "Technical documentation built from the running system, not from memory."
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 form. The older `license = { text = "MIT" }` table is rejected outright
# by current setuptools once `license-files` is present, which made the package
# unbuildable from a clean checkout. Nobody knew, because nothing built it.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gilad Bronshtein" }]
keywords = ["documentation", "technical-writing", "playwright", "docx", "screenshots"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
]
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "python-docx>=1.1",
  "playwright>=1.44",
  "Pillow>=10.0",
  # Used by the auto-crop and the screenshot fingerprint. It was imported
  # and never declared, so a clean install failed on the first crawl.
  "numpy>=1.24",
  "pypdf>=4.0",
]

[project.optional-dependencies]
# Pinned, for the same reason the rule selection is.
dev = ["ruff==0.14.5"]
# The writing assistance talks to a model over the Anthropic Messages API. It is
# optional because capture, drift, lint, build and release do not need it, and a
# documentation tool should not require a model to render a document. It was
# imported without ever being declared, so a clean install produced a console
# whose assistance was permanently unavailable and blamed the user's machine.
assist = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/GiladBronshtein/verba"
Issues = "https://github.com/GiladBronshtein/verba/issues"

[project.scripts]
verba = "verba.cli:main"

[tool.setuptools]
packages = ["verba", "verba.console", "verba.render"]

[tool.setuptools.package-data]
# The themes live inside the package because a theme is not documentation, it
# is something the engine cannot render without. They sat beside the package
# and were never shipped, so any real install had no themes at all and every
# build died on "no such theme: slate". Nobody hit it because every user so
# far ran from a checkout.
verba = ["console/static/*", "themes/*.yaml"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly. Ruff's default selection changes between releases, so a
# checkout that is clean on one machine fails on another with three hundred
# findings nobody introduced. What is checked here is a decision, not whatever
# the installed version happens to think today.
select = ["E", "F", "W", "I"]

# E702 is a semicolon joining two statements. Used here only for pairs that are
# one thought, where splitting them makes the surrounding logic harder to read
# rather than easier.
ignore = ["E702"]

[tool.ruff.lint.per-file-ignores]
# E501 is a line over 100 characters. These files carry data rather than code:
# SVG path geometry, injected browser scripts, CSS, YAML fixtures and prose
# strings. Wrapping any of them makes the thing harder to read, not easier, and
# a rule that has to be worked around everywhere it applies is being applied in
# the wrong place.
"verba/glyphs.py" = ["E501"]
"verba/render/html.py" = ["E501"]
"verba/forms.py" = ["E501"]
"verba/healing.py" = ["E501"]
"verba/layout.py" = ["E501"]
"verba/lint.py" = ["E501"]
"verba/scaffold.py" = ["E501"]
"verba/system.py" = ["E501"]
"tools/selftest.py" = ["E501"]
# The launcher it writes is a shell script embedded as a string: its lines are
# shell, not Python, and wrapping them changes what runs.
"tools/build_app.py" = ["E501"]
